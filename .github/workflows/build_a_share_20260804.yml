name: Build A-share Snapshot 20260804

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build_a_share_20260804.yml
      - run_market_snapshot_v7.py
      - update_crowding_daily_v3.py
      - update_sw_industry_current.py

permissions:
  contents: read

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile build_market_snapshot.py backfill_market_and_crowding.py run_market_snapshot_v2.py run_market_snapshot_v3.py run_market_snapshot_v4.py run_market_snapshot_v5.py run_market_snapshot_v6.py run_market_snapshot_v7.py
      - name: Build 2026-08-04 market snapshot
        shell: bash
        run: |
          mkdir -p data
          set -o pipefail
          python run_market_snapshot_v7.py --target-date 20260804 --workers 32 2>&1 | tee data/market_snapshot_run_20260804.log
      - name: Upload market snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-snapshot-20260804
          path: |
            data/*20260804.csv
            data/market_daily_history.csv
            data/market_snapshot_run_20260804.log
          if-no-files-found: warn

  shenwan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile update_sw_industry.py update_sw_industry_current.py
      - name: Update Shenwan historical base
        run: python update_sw_industry.py --history-rows 260 --sleep-seconds 0.12
      - name: Build 2026-08-04 Shenwan snapshot
        shell: bash
        run: |
          set -o pipefail
          python update_sw_industry_current.py --target-date 20260804 2>&1 | tee data/sw_industry_run_20260804.log
      - name: Upload Shenwan snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-industry-data-20260804
          path: |
            data/*.csv
            data/sw_industry_run_20260804.log
          if-no-files-found: warn

  crowding:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile update_crowding_daily_v3.py run_market_snapshot_v2.py run_market_snapshot_v6.py
      - name: Build 2026-08-04 crowding row
        shell: bash
        run: |
          mkdir -p data
          set -o pipefail
          python update_crowding_daily_v3.py --target-date 20260804 2>&1 | tee data/crowding_run_20260804.log
      - name: Upload crowding row
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crowding-current-20260804
          path: |
            data/industry_crowding_daily_20260804.csv
            data/crowding_run_20260804.log
          if-no-files-found: warn
