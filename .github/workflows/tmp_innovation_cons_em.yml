name: Innovation Drug THS Diagnostic
on:
  pull_request:
    paths:
      - .github/workflows/trigger_innovation_cons_em.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-market-dashboard-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python diagnose_innovation_ths.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: innovation-ths-diagnostic
          path: data/innovation_ths_diagnostic.json
          if-no-files-found: warn
