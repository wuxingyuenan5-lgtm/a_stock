name: Update Shenwan Industry Data

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Trading date in YYYYMMDD"
        required: true
        default: "20260730"
  pull_request:
    paths:
      - update_sw_industry.py
      - update_sw_industry_current.py
      - requirements.txt
      - .github/workflows/update_sw_industry.yml
  push:
    branches:
      - main
    paths:
      - update_sw_industry.py
      - update_sw_industry_current.py
      - requirements.txt
      - .github/workflows/update_sw_industry.yml

concurrency:
  group: sw-industry-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate scripts
        run: python -m py_compile update_sw_industry.py update_sw_industry_current.py

      - name: Resolve target date
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "date=${{ inputs.target_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=20260730" >> "$GITHUB_OUTPUT"
          fi

      - name: Update historical base
        run: python update_sw_industry.py --history-rows 260 --sleep-seconds 0.20

      - name: Build exact-date current snapshot
        run: python update_sw_industry_current.py --target-date "${{ steps.target.outputs.date }}"

      - name: Upload generated CSV files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-industry-data-${{ steps.target.outputs.date }}
          path: data/*.csv
          if-no-files-found: warn

      - name: Commit updated CSV files
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: update Shenwan industry tracker"
          git push
