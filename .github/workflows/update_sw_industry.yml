name: Update Shenwan Industry Data

# Manual fallback only. The daily market-monitor workflow refreshes this snapshot once
# inside the same production run so the render bundle is self-consistent.
on:
  workflow_dispatch:

concurrency:
  group: sw-industry-manual-refresh
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate script
        run: python -m py_compile update_sw_industry.py

      - name: Update industry data
        run: python update_sw_industry.py --history-rows 260 --workers 4 --sleep-seconds 0.15

      - name: Upload generated CSV files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-industry-data
          path: data/*.csv
          if-no-files-found: warn

      - name: Commit updated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: update Shenwan industry tracker"
          git pull --rebase origin main
          git push
