name: Innovation Drug Turnover Proxy 20260810
on:
  push:
    branches: [daily-snapshot-20260810]
    paths:
      - .github/workflows/innovation_turnover_proxy_20260810.yml
permissions:
  contents: read
jobs:
  innovation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-market-dashboard-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch_innovation_drug_history.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: innovation-turnover-proxy-20260810
          path: data/innovation_drug_history_2026.csv
          if-no-files-found: warn
