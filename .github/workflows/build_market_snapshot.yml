name: Build A-share Market Snapshot

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Trading date in YYYYMMDD"
        required: true
        default: "20260729"
  pull_request:
    paths:
      - build_market_snapshot.py
      - run_market_snapshot_v2.py
      - .github/workflows/build_market_snapshot.yml
      - requirements.txt
      - .snapshot-validation
  push:
    branches:
      - main
    paths:
      - build_market_snapshot.py
      - run_market_snapshot_v2.py
      - .github/workflows/build_market_snapshot.yml
      - requirements.txt

concurrency:
  group: market-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate scripts
        run: python -m py_compile build_market_snapshot.py run_market_snapshot_v2.py

      - name: Resolve target date
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "date=${{ inputs.target_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=20260729" >> "$GITHUB_OUTPUT"
          fi

      - name: Build snapshot
        id: build
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p data
          set +e
          python run_market_snapshot_v2.py --target-date "${{ steps.target.outputs.date }}" --workers 32 2>&1 | tee "data/market_snapshot_run_${{ steps.target.outputs.date }}.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-snapshot-${{ steps.target.outputs.date }}
          path: |
            data/*${{ steps.target.outputs.date }}.csv
            data/market_snapshot_run_${{ steps.target.outputs.date }}.log
          if-no-files-found: warn

      - name: Commit snapshot files and log
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: build A-share snapshot ${{ steps.target.outputs.date }}"
            git push
          fi

      - name: Fail if snapshot failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
