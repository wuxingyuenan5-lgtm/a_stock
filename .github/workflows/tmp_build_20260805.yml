name: Temporary Build A-share 20260805

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp_build_20260805.yml
  pull_request:
    paths:
      - .github/workflows/build_a_share_20260805_clean.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market_fast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-market-dashboard-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run_market_snapshot_v12.py --target-date 20260805 --workers 32
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-snapshot-v12-20260805
          path: |
            data/*20260805.csv
            data/market_daily_history.csv
          if-no-files-found: warn
