name: Update Crowding 20260803

on:
  workflow_dispatch:
  pull_request:
    paths:
      - update_crowding_daily_v3.py
      - .github/workflows/update_crowding_20260803.yml

permissions:
  contents: read

jobs:
  crowding:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile update_crowding_daily_v3.py run_market_snapshot_v2.py run_market_snapshot_v6.py
      - name: Build 2026-08-03 crowding row
        shell: bash
        run: |
          mkdir -p data
          set -o pipefail
          python update_crowding_daily_v3.py --target-date 20260803 2>&1 | tee data/crowding_run_20260803.log
      - name: Upload crowding row
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crowding-current-20260803
          path: |
            data/industry_crowding_daily_20260803.csv
            data/crowding_run_20260803.log
          if-no-files-found: warn
