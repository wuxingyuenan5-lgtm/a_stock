name: Build A-share Snapshot 20260731

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build_a_share_20260731.yml

permissions:
  contents: read

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate market scripts
        run: python -m py_compile build_market_snapshot.py run_market_snapshot_v2.py run_market_snapshot_v3.py run_market_snapshot_v4.py run_market_snapshot_v5.py run_market_snapshot_v6.py
      - name: Build 2026-07-31 market snapshot
        shell: bash
        run: |
          mkdir -p data
          set -o pipefail
          python run_market_snapshot_v6.py --target-date 20260731 --workers 32 2>&1 | tee data/market_snapshot_run_20260731.log
      - name: Upload market snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-snapshot-20260731
          path: |
            data/*20260731.csv
            data/market_daily_history.csv
            data/market_snapshot_run_20260731.log
          if-no-files-found: warn

  shenwan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Shenwan scripts
        run: python -m py_compile update_sw_industry.py update_sw_industry_current.py
      - name: Update Shenwan historical base
        run: python update_sw_industry.py --history-rows 260 --sleep-seconds 0.20
      - name: Build exact-date Shenwan snapshot
        shell: bash
        run: |
          set -o pipefail
          python update_sw_industry_current.py --target-date 20260731 2>&1 | tee data/sw_industry_run_20260731.log
      - name: Upload Shenwan snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-industry-data-20260731
          path: |
            data/*.csv
            data/sw_industry_run_20260731.log
          if-no-files-found: warn
