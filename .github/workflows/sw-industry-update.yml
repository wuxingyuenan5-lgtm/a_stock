name: Update Shenwan industry data

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Update data
        run: python update_sw_industry.py --history-rows 260 --workers 4 --sleep-seconds 0.2
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/sw_industry_history.csv data/sw_industry_latest.csv data/sw_industry_failures.csv; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sw_industry_history.csv data/sw_industry_latest.csv
          if [ -f data/sw_industry_failures.csv ]; then git add data/sw_industry_failures.csv; else git rm --ignore-unmatch data/sw_industry_failures.csv; fi
          git commit -m "data: update Shenwan industry indices"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
