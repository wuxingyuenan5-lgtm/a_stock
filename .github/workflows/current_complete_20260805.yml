name: Complete A-share Snapshot 20260805

on:
  push:
    branches:
      - chatgpt/a-monitor-current-complete
    paths:
      - current_complete_20260805.py
      - .github/workflows/current_complete_20260805.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build complete paginated snapshot
        run: python current_complete_20260805.py
      - name: Upload complete snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-monitor-20260805-current-complete
          path: data/current_complete_20260805
          if-no-files-found: error
