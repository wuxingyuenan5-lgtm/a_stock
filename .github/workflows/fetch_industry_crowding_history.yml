name: Fetch Industry Crowding History

on:
  workflow_dispatch:
  push:
    branches:
      - optimize-market-dashboard-v1
    paths:
      - fetch_industry_crowding_history.py
      - backfill_market_and_crowding.py
      - .github/workflows/fetch_industry_crowding_history.yml
  pull_request:
    paths:
      - fetch_industry_crowding_history.py
      - backfill_market_and_crowding.py
      - .github/workflows/fetch_industry_crowding_history.yml

permissions:
  contents: read

concurrency:
  group: fetch-industry-crowding-history
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile fetch_industry_crowding_history.py backfill_market_and_crowding.py
      - name: Fetch crowding history
        shell: bash
        run: |
          mkdir -p data
          set -o pipefail
          python fetch_industry_crowding_history.py --start-date 2026-01-01 --end-date 2026-07-31 2>&1 | tee data/industry_crowding_run.log
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: industry-crowding-history-2026
          path: |
            data/industry_crowding_history.csv
            data/industry_crowding_quality.csv
            data/industry_crowding_run.log
          if-no-files-found: warn
