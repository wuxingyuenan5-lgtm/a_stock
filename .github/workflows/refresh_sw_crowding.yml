name: Refresh Shenwan Crowding Cache

on:
  workflow_dispatch:
  schedule:
    - cron: "33,43,53 15 * * 1-5"
      timezone: "Asia/Shanghai"
    - cron: "3,13,23,33,43,53 16-19 * * 1-5"
      timezone: "Asia/Shanghai"

concurrency:
  group: refresh-sw-crowding
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile refresh_sw_crowding.py market_monitor/sw_cache.py
      - name: Probe Shenwan daily analysis
        id: probe
        shell: bash
        run: |
          set +e
          python refresh_sw_crowding.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Shenwan daily analysis is not ready yet; keep previous cache and wait for next probe."
          fi
      - name: Commit cache
        if: steps.probe.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/sw_analysis_daily_second.csv data/history/sw_analysis_daily_second.csv
          if git diff --cached --quiet; then
            echo "No Shenwan crowding changes"
          else
            git commit -m "data: refresh Shenwan crowding cache"
            git pull --rebase origin main
            git push
          fi
