name: Fetch Official Shenwan Crowding History 20260804

on:
  workflow_dispatch:
  pull_request:
    paths:
      - fetch_sw_crowding_history.py
      - .github/workflows/fetch_sw_crowding_history_20260804.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-market-dashboard-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile fetch_sw_crowding_history.py
      - name: Fetch official Shenwan crowding through 2026-08-04
        shell: bash
        run: |
          mkdir -p data
          set -o pipefail
          python fetch_sw_crowding_history.py --start-date 20260101 --end-date 20260804 2>&1 | tee data/sw_crowding_official_run_20260804.log
      - name: Upload official crowding history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-crowding-official-history-20260804
          path: |
            data/sw_crowding_official_history_2026.csv
            data/sw_crowding_official_quality_2026.csv
            data/sw_crowding_official_run_20260804.log
          if-no-files-found: warn
