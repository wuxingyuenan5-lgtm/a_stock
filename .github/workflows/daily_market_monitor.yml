name: Daily A-share Market Monitor

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Trading date, YYYY-MM-DD; blank uses Asia/Shanghai today"
        required: false
        default: ""
      refresh_mapping:
        description: "Force refresh Shenwan stock mapping"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - run_daily.py
      - prepare_render_bundle.py
      - excel_renderer_artifact.py
      - run_excel_renderer.py
      - run_excel_renderer_v12.py
      - run_excel_renderer_v12_safe.py
      - run_excel_renderer_v13.py
      - market_monitor/**
      - tests/**
      - config/market_monitor.json
      - config/excel_renderer.json
      - requirements.txt
      - .github/workflows/daily_market_monitor.yml

concurrency:
  group: daily-market-monitor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Resolve date
        id: date
        shell: bash
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then target="${{ inputs.target_date }}"; else target="$(date +%F)"; fi
          echo "value=$target" >> "$GITHUB_OUTPUT"
      - name: Syntax and unit tests
        run: |
          python -m py_compile run_daily.py prepare_render_bundle.py refresh_sw_crowding.py refresh_sw_mapping.py excel_renderer_artifact.py run_excel_renderer.py run_excel_renderer_v12.py run_excel_renderer_v12_safe.py run_excel_renderer_v13.py
          python -m py_compile market_monitor/*.py
          python -m unittest discover -s tests -v
      - name: Refresh Shenwan cache once
        continue-on-error: true
        run: python refresh_sw_crowding.py
      - name: Produce normalized payload
        shell: bash
        run: |
          extra=""
          if [ "${{ inputs.refresh_mapping }}" = "true" ]; then extra="--refresh-mapping"; fi
          python run_daily.py --target-date "${{ steps.date.outputs.value }}" $extra
      - name: Prepare Excel renderer bundle
        run: |
          python prepare_render_bundle.py --target-date "${{ steps.date.outputs.value }}"
          cp data/history/market_core.csv "output/${{ steps.date.outputs.value }}/market_core.csv"
      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: a-share-monitor-${{ steps.date.outputs.value }}
          path: output/${{ steps.date.outputs.value }}/
          if-no-files-found: error
          retention-days: 30
      - name: Persist incremental histories and JSON archive
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history data/cache "output/${{ steps.date.outputs.value }}/*.json"
          if git diff --cached --quiet; then
            echo "No persistent data changes"
          else
            git commit -m "data: daily market monitor ${{ steps.date.outputs.value }}"
            git pull --rebase origin main
            git push
          fi
