name: Daily A-share Market Monitor

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Trading date, YYYY-MM-DD; blank uses Asia/Shanghai today"
        required: false
        default: ""
      refresh_mapping:
        description: "Force refresh Shenwan stock mapping"
        required: false
        type: boolean
        default: false
      full_refresh_sw_industry:
        description: "Run slow per-index Shenwan history refresh instead of fast bulk incremental refresh"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - run_daily.py
      - run_history_preflight.py
      - build_report_data.py
      - render_market_monitor_html.py
      - validate_market_monitor_html.py
      - prepare_render_bundle.py
      - excel_renderer_artifact.py
      - run_excel_renderer.py
      - run_excel_renderer_v14.py
      - run_excel_renderer_v15.py
      - market_monitor/**
      - update_sw_industry.py
      - update_sw_industry_fast.py
      - tests/**
      - config/market_monitor.json
      - config/excel_renderer.json
      - config/web_production_runtime.json
      - config/html_production_runtime.json
      - requirements.txt
      - .github/workflows/daily_market_monitor.yml

concurrency:
  group: daily-market-monitor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve date
        id: date
        shell: bash
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            target="${{ inputs.target_date }}"
          else
            target="$(date +%F)"
          fi
          echo "value=$target" >> "$GITHUB_OUTPUT"
          echo "compact=${target//-/}" >> "$GITHUB_OUTPUT"

      - name: Fast syntax preflight
        run: |
          python -m py_compile \
            run_daily.py run_history_preflight.py build_report_data.py \
            render_market_monitor_html.py validate_market_monitor_html.py \
            prepare_render_bundle.py excel_renderer_artifact.py \
            run_excel_renderer.py run_excel_renderer_v14.py run_excel_renderer_v15.py \
            refresh_sw_crowding.py refresh_sw_mapping.py \
            update_sw_industry.py update_sw_industry_fast.py
          python -m py_compile market_monitor/*.py

      - name: Full unit tests on code review only
        if: github.event_name == 'pull_request'
        run: python -m unittest discover -s tests -v

      - name: History preflight and recoverable backfill
        if: github.event_name != 'pull_request'
        run: python run_history_preflight.py --target-date "${{ steps.date.outputs.value }}"

      - name: Refresh Shenwan crowding cache once
        if: github.event_name != 'pull_request'
        run: python refresh_sw_crowding.py

      - name: Produce normalized payload
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          extra=""
          if [ "${{ inputs.refresh_mapping }}" = "true" ]; then
            extra="--refresh-mapping"
          fi
          python run_daily.py --target-date "${{ steps.date.outputs.value }}" $extra

      - name: Refresh Shenwan industry snapshot
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          target="${{ steps.date.outputs.value }}"
          today="$(date +%F)"
          if [ "${{ inputs.full_refresh_sw_industry }}" = "true" ]; then
            echo "Running full Shenwan history refresh"
            python update_sw_industry.py --history-rows 260 --workers 4 --sleep-seconds 0.15 \
              || echo "::warning::Full Shenwan refresh failed; report will use the last validated cached snapshot."
          elif [ "$target" = "$today" ]; then
            echo "Running fast bulk Shenwan incremental refresh"
            python update_sw_industry_fast.py --target-date "$target" \
              || echo "::warning::Fast Shenwan refresh failed; report will use the last validated cached snapshot."
          else
            echo "::notice::Historical target date; skip realtime Shenwan refresh and use validated cache."
          fi

      - name: Build normalized report data
        if: github.event_name != 'pull_request'
        run: python build_report_data.py --target-date "${{ steps.date.outputs.value }}"

      - name: Render offline HTML
        if: github.event_name != 'pull_request'
        run: |
          python render_market_monitor_html.py \
            --input "output/${{ steps.date.outputs.value }}/report_data.json" \
            --output "output/${{ steps.date.outputs.value }}/A股每日市场监控_${{ steps.date.outputs.compact }}.html"

      - name: Validate HTML
        if: github.event_name != 'pull_request'
        run: |
          python validate_market_monitor_html.py \
            --data "output/${{ steps.date.outputs.value }}/report_data.json" \
            --html "output/${{ steps.date.outputs.value }}/A股每日市场监控_${{ steps.date.outputs.compact }}.html" \
            --output "output/${{ steps.date.outputs.value }}/html_validation.json"

      - name: Write latest HTML pointer
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          d = "${{ steps.date.outputs.value }}"
          compact = "${{ steps.date.outputs.compact }}"
          validation = json.loads(Path(f"output/{d}/html_validation.json").read_text(encoding="utf-8"))
          pointer = {
              "date": d,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "artifact_name": f"a-share-monitor-html-{d}",
              "primary_file": f"A股每日市场监控_{compact}.html",
              "data_contract": "report_data.json",
              "validation_file": "html_validation.json",
              "validation_status": validation["status"],
              "runtime_manifest": "config/html_production_runtime.json",
              "workflow": "daily_market_monitor.yml"
          }
          Path("data/latest_bundle_pointer.json").write_text(
              json.dumps(pointer, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(pointer, ensure_ascii=False))
          PY

      - name: Upload HTML production artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: a-share-monitor-html-${{ steps.date.outputs.value }}
          path: |
            output/${{ steps.date.outputs.value }}/A股每日市场监控_${{ steps.date.outputs.compact }}.html
            output/${{ steps.date.outputs.value }}/report_data.json
            output/${{ steps.date.outputs.value }}/html_validation.json
            output/${{ steps.date.outputs.value }}/history_preflight.json
            output/${{ steps.date.outputs.value }}/source_manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Persist histories, snapshots, HTML archive, and latest pointer
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/history data/cache \
            data/sw_industry_history.csv data/sw_industry_latest.csv \
            data/latest_bundle_pointer.json \
            "output/${{ steps.date.outputs.value }}/*.json" \
            "output/${{ steps.date.outputs.value }}/*.html"
          if git diff --cached --quiet; then
            echo "No persistent data changes"
          else
            git commit -m "data: daily HTML market monitor ${{ steps.date.outputs.value }}"
            git pull --rebase origin main
            git push
          fi
