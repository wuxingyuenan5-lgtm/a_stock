name: Fetch Tencent Index and BSE History

on:
  workflow_dispatch:
  push:
    branches:
      - optimize-market-dashboard-v1
    paths:
      - fetch_tx_index_bj_history.py
      - .github/workflows/fetch_tx_index_bj_history.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - fetch_tx_index_bj_history.py
      - .github/workflows/fetch_tx_index_bj_history.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-market-dashboard-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile fetch_tx_index_bj_history.py
      - name: Fetch Tencent index and Beijing Exchange history
        shell: bash
        run: |
          mkdir -p data
          set -o pipefail
          python fetch_tx_index_bj_history.py --start-date 20260101 --end-date 20260803 --workers 16 2>&1 | tee data/tx_index_bj_run.log
      - name: Upload history supplement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tx-index-bj-history-2026
          path: |
            data/tx_index_history_2026.csv
            data/bj_stock_history_tx_2026.csv
            data/bj_stock_history_tx_errors_2026.csv
            data/tx_index_bj_quality_2026.csv
            data/tx_index_bj_run.log
          if-no-files-found: warn
