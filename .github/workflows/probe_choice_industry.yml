name: Probe Choice Industry Data

on:
  workflow_dispatch:
  pull_request:
    paths:
      - probe_choice_industry.py
      - .github/workflows/probe_choice_industry.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python probe_choice_industry.py
