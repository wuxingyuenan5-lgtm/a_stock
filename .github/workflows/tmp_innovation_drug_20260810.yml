name: Innovation Drug History 20260810

on:
  pull_request:
    paths:
      - .github/workflows/trigger_innovation_20260810.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  innovation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-market-dashboard-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch_innovation_drug_history_only.py
      - run: pip install --force-reinstall 'akshare==1.14.16' 'pandas<3'
      - run: python fetch_innovation_drug_cons_old.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: innovation-drug-history-20260810
          path: |
            data/innovation_drug_history_raw_2026.csv
            data/innovation_drug_constituents_20260810.csv
          if-no-files-found: warn
